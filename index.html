<style>
:root{--bg:#f0f0f0;--card:#fff;--ink:#1a1a1a;--mute:#6b6b6b;--line:#dcdcdc;--g:#1a1a1a;--gs:#ececec;--r:#b3402a;--warn:#f6e6e1;--field:#f7f7f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1e1e1e;--ink:#ececec;--mute:#9a9a9a;--line:#333;--g:#f0f0f0;--gs:#2b2b2b;--r:#f08a73;--warn:#3a211b;--field:#171717}}
:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--ink:#ececec;--mute:#9a9a9a;--line:#333;--g:#f0f0f0;--gs:#2b2b2b;--r:#f08a73;--warn:#3a211b;--field:#171717}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:26px;line-height:1.2;margin:10px 0 6px;letter-spacing:.01em}
h2{font-size:18px;margin:0 0 4px}
p.s{color:var(--mute);margin:0 0 16px;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
header h1{margin:0}
.hb{display:flex;gap:8px;flex:none}
.hb button{padding:8px 14px;font-size:14px;border-radius:999px}
section{background:var(--card);border-radius:16px;padding:20px 16px;margin-bottom:18px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
section>h2+p.s{margin-top:2px}
label.f,div.f{display:block;font-size:13px;color:var(--mute);font-weight:500}
input[type=text],input[type=number],input:not([type]),input[type=date],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0;margin-top:4px}
input:focus,select:focus{outline:2px solid var(--g);outline-offset:1px;background:var(--card)}
.row{display:grid;gap:10px;margin-bottom:12px;padding:12px;background:var(--bg);border-radius:12px}
.row small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.row input{background:var(--card)}
.fx{grid-template-columns:1fr 110px 40px;align-items:end}
.fx input{margin-top:0}
.in{grid-template-columns:repeat(3,1fr)}
.in .wd{grid-column:1/-1}
.in .w2{grid-column:span 2}
.in .dl{grid-column:1/-1;justify-self:end}
.rc{grid-template-columns:1.4fr 1fr}
.rc .wd{grid-column:1/-1}
.rc .dl{grid-column:1/-1;justify-self:end}
.rc button.x{height:auto;padding:8px 14px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bgrid small{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:500}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
#topchips{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.chip{flex:none;border-radius:999px;padding:7px 14px;font-size:14px;background:var(--card)}
.chip.all{background:var(--card);color:var(--ink);border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{scroll-margin-top:64px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{margin:0}
.tg{flex:none;width:36px;height:36px;padding:0;font-size:22px;line-height:1;color:var(--ink);border-radius:999px}
.sbody{margin-top:14px}
#finalbox td:first-child,#nres td:first-child{white-space:normal}
.rh{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.rt{min-width:0;display:flex;flex-direction:column}
.rt b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt span{font-size:13px;color:var(--mute)}
.ar{flex:none;width:34px;height:34px;padding:0;font-size:15px;border-radius:999px}
.row.closed>*:not(.rh){display:none}
.row.dn .rt b,.row.dn .rt span{text-decoration:line-through;opacity:.5}
.pl2{grid-template-columns:1fr 1fr 1fr;align-items:end}
.fx .fw{grid-column:1/-1}
.cc{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.cc input{width:18px;height:18px;margin:0;padding:0;accent-color:var(--g)}
#finalbox td.sub,#nres td.sub{background:var(--bg);font-size:12px;font-weight:600;color:var(--mute);white-space:normal}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;margin-bottom:10px}
.gh h3{margin:0}
#gfx{margin-top:22px}
b.neg{color:var(--r)}
#rcov,#ncov{width:130px;margin:0;text-align:right;padding:6px 8px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;width:100%;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg h4{margin:0 0 8px;font-size:17px}
.dlg p{margin:0 0 18px;color:var(--mute);font-size:14px}
.dbtn{display:flex;gap:10px}
.dbtn button{flex:1;padding:11px}
.dbtn .dd{background:var(--r);color:var(--card);border-color:var(--r);font-weight:600}
.ur{display:grid;grid-template-columns:28px 1fr 96px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ur input[type=checkbox]{width:20px;height:20px;margin:0;padding:0;accent-color:var(--g)}
.ur input[type=text],.ur input[type=number],.ur input:not([type]){margin:0;padding:8px 9px;font-size:15px}
.ur button.x{height:36px;padding:0}
.ur.done{opacity:.65}
.ur.done input:not([type=checkbox]){text-decoration:line-through;color:var(--mute)}
.totop{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;padding:0;border-radius:50%;background:var(--ink);color:var(--bg);border:none;font-size:22px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.sr{display:flex;gap:8px;align-items:center}
.sr input{flex:1;min-width:0;margin-top:0}
.sr .chk{margin:0;flex:none}
.sr .chk label{padding:8px 10px;font-size:14px}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;margin:0 0 14px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:999px;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#f_miss{color:var(--r)}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fadein{animation:fin .22s ease}
.row.opening>*:not(.rh){animation:fin .22s ease}
@media (prefers-reduced-motion:reduce){.fadein,.row.opening>*:not(.rh){animation:none}}
.addc{display:grid;grid-template-columns:1fr 84px auto;gap:8px;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.tag2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;background:var(--field)}
.tag2 img{width:18px;height:18px;object-fit:contain}
.tag2 button,.cx{border:none;background:none;color:var(--mute);padding:2px 6px;font-size:14px;border-radius:999px}
.addc input{margin-top:0}
.pl{grid-template-columns:1.2fr 1fr 1fr 40px;align-items:end}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
button.x{padding:8px 10px;color:var(--mute);background:var(--card);height:42px}
button.x:hover,button.x:active,button.x:focus-visible{color:var(--r);border-color:var(--r)}
.in button.x{height:auto;padding:8px 14px}
section .sbody>button,section .gb>button{width:100%;border:none;background:var(--bg);color:var(--ink);font-weight:600;padding:13px;border-radius:12px}
section .sbody>button:active,section .gb>button:active{background:var(--line)}
.stack{display:grid;gap:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.sum div{background:var(--gs);border-radius:12px;padding:14px}
.sum div.bad{background:var(--warn)}
.sum b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--mute)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;background:var(--gs);color:var(--g);margin-right:4px}
.tag.r{background:var(--warn);color:var(--r)}
.adv{padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);line-height:1.65}
.adv:first-child{background:var(--gs);border-color:transparent}
.scroll{overflow-x:auto;margin-top:10px;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--bg)}
td,th{padding:9px 10px;text-align:right;white-space:nowrap}
tr+tr td{border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.neg{color:var(--r);font-weight:700}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chk label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--field);color:var(--ink);cursor:pointer;font-size:15px}
.chk img{width:24px;height:24px;object-fit:contain;display:block}
.chk input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--g)}
.chk label:has(input:checked){background:var(--gs);border-color:var(--g)}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.ln{grid-template-columns:1fr 1fr auto}
.ln .wd{grid-column:1/-1}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;min-height:44px;display:block}
.ln .nm{grid-column:1/3}
.ln .dl{grid-column:3;justify-self:end;align-self:end}
.ln-info{grid-column:1/-1;font-size:14px;color:var(--ink);background:var(--card);border-radius:10px;padding:10px 12px}
h3{font-size:15px;margin:22px 0 0}
</style>
</head>

<tr><td colspan="2" class="sub">收入</td></tr>

<script>
const $=id=>document.getElementById(id);
(function(){
  let H={};try{const v3=localStorage.getItem('planner_hide3');H=JSON.parse(v3||localStorage.getItem('planner_hide')||'{}')}catch(e){}
  let F4=false;try{F4=!!localStorage.getItem('planner_hide5')}catch(e){}
  const save=()=>{try{localStorage.setItem('planner_hide5','1');localStorage.setItem('planner_hide3',JSON.stringify(H))}catch(e){}};
  const bar=$('topchips'),L=[],seen={},CH=[],SC=[];let lock=0;
  const act=i=>{CH.forEach((x,j)=>x.classList.toggle('on',j===i));const c=CH[i];if(c)bar.scrollTo({left:c.offsetLeft-bar.clientWidth/2+c.offsetWidth/2,behavior:'smooth'})};
  const all=document.createElement('button');all.className='chip all';bar.append(all);
  (function(){const m=document.querySelector('main'),f=t=>[...m.children].find(x=>x.tagName==='SECTION'&&x.querySelector('h2')&&x.querySelector('h2').textContent.trim()===t);
    const r=f('結果'),b=f('本期帳單'),first=[...m.children].find(x=>x.tagName==='SECTION');
    if(r&&first&&r!==first)m.insertBefore(r,first);if(r&&b)r.after(b)})();
  document.querySelectorAll('main>section').forEach((sec,i)=>{
    const h2=sec.querySelector('h2'),tx=h2.textContent;seen[tx]=(seen[tx]||0)+1;const name=seen[tx]>1?tx+'#'+seen[tx]:tx;sec.id='sec'+i;
    const hd=document.createElement('div');hd.className='sh';sec.insertBefore(hd,h2);hd.append(h2);
    const body=document.createElement('div');body.className='sbody';
    while(hd.nextSibling)body.append(hd.nextSibling);sec.append(body);
    const b=document.createElement('button');b.className='tg';hd.append(b);
    const set=(hide,inst)=>{slide(body,!hide,inst);b.textContent=hide?'+':'−';b.setAttribute('aria-label',hide?'顯示':'隱藏');H[name]=hide};
    b.onclick=()=>{set(!H[name]);save();sync()};
    if(!F4)H[name]=!(tx==='結果'||tx==='本期帳單');
    set(!!H[name],true);
    const c=document.createElement('button');c.className='chip';c.textContent=tx;
    c.onclick=()=>{if(H[name]){set(false,true);save();sync()}lock=Date.now()+900;act(i);sec.scrollIntoView({behavior:'smooth',block:'start'})};
    bar.append(c);CH.push(c);SC.push(sec);L.push({name,set});
  });
  let tk=false;const spy=()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{tk=false;if(Date.now()<lock)return;let k=0;SC.forEach((x,j)=>{if(x.getBoundingClientRect().top<=90)k=j});act(k)})};
  window.addEventListener('scroll',spy,{passive:true});act(0);
  const sync=()=>{all.textContent=L.some(x=>!H[x.name])?'全部隱藏':'全部顯示'};
  all.onclick=()=>{const hide=L.some(x=>!H[x.name]);L.forEach(x=>x.set(hide));save();sync()};
  sync();if(!F4)save();
})();
function fixCards(){if(!S.spend)S.spend={};if(!S.unpaid)S.unpaid=UP0();if(!S.incomes)S.incomes=S.income>0?[{n:'收入',a:S.income}]:[];S.cards=S.cards||['星展','國泰','渣打'];S.due=S.due||{'國泰':13,'星展':14,'渣打':17};if(!S.noinst){S.noinst=[];if(!S.cards.includes('聯邦')){S.cards.push('聯邦');S.due['聯邦']=13;S.noinst.push('聯邦')}}}
const rcAmt=o=>o.m||0;
function rcPast(o){if(!o.d)return false;const [Y,M,D]=o.d.split('-').map(Number),t=new Date();t.setHours(0,0,0,0);return new Date(Y,M-1,D)<t}
function askDel(what,fn,o){
  o=o||{};
  const ov=document.createElement('div');ov.className='ov';
  const bx=document.createElement('div');bx.className='dlg';
  bx.innerHTML='<h4></h4><p></p><div class="dbtn"><button type="button" class="dc">取消</button><button type="button" class="dd"></button></div>';
  bx.querySelector('h4').textContent=o.title||'確定要刪除嗎？';
  bx.querySelector('p').textContent=what+(o.note||'刪除後無法復原。');
  bx.querySelector('.dd').textContent=o.ok||'刪除';
  if(o.single)bx.querySelector('.dc').remove();
  const kd=e=>{if(e.key==='Escape')close()};
  const close=()=>{ov.remove();document.removeEventListener('keydown',kd)};
  document.addEventListener('keydown',kd);
  const dcb=bx.querySelector('.dc');if(dcb)dcb.onclick=close;
  bx.querySelector('.dd').onclick=()=>{close();fn()};
  ov.onclick=e=>{if(e.target===ov)close()};
  ov.append(bx);document.body.append(ov);(bx.querySelector('.dc')||bx.querySelector('.dd')).focus();
}
function UP0(){return []}
function usedBy(c){return S.inst.filter(o=>(o.card||'').trim()===c).length}
function cnote(m){['cardnote','cardnote2'].forEach(id=>{const e=$(id);if(e)e.textContent=m});clearTimeout(cnote.t);cnote.t=setTimeout(()=>cnote(''),5000)}
function delCard(c){const n=usedBy(c);if(n){cnote('「'+c+'」還有 '+n+' 筆分期，請先刪除這些分期或改成別的卡。');return}
  askDel('信用卡「'+c+'」',()=>{S.cards=S.cards.filter(x=>x!==c);S.noinst=S.noinst.filter(x=>x!==c);delete S.due[c];delete S.bills[c];delete S.spend[c];draw();calc()},{title:'確定要刪除這張信用卡嗎？',note:'本期帳單的金額也會一起刪除，無法復原。'})}
function rmInst(c){const n=usedBy(c);if(n){cnote('「'+c+'」還有 '+n+' 筆分期，請先刪除這些分期或改成別的卡。');return}askDel('「'+c+'」',()=>{if(!S.noinst.includes(c))S.noinst.push(c);draw();calc()},{title:'要從分期選項移除嗎？',note:'本期帳單裡仍會保留這張卡，之後可以再新增回來。',ok:'移除'})}
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&t.type==='number')setTimeout(()=>{try{t.select()}catch(x){}},0)});
let GT={in:0,fx:0};
function setupTabs(){const bs=$('restabs').querySelectorAll('button');
  const set=(t,first)=>{bs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('tabm').style.display=t==='m'?'':'none';$('tabn').style.display=t==='n'?'':'none';
    if(!first){const sh=$(t==='m'?'tabm':'tabn');sh.classList.remove('fadein');void sh.offsetWidth;sh.classList.add('fadein')}};
  bs.forEach(b=>b.onclick=()=>set(b.dataset.t));set('m',true)}
function grpUpd(){[['gin',GT.in],['gfx',GT.fx]].forEach(([id,v])=>{const g=$(id);if(g)g.querySelector('.gt').textContent=FOLD[id]?'：$'+fmt(v||0):''})}
function setupGroups(){['gin','gfx'].forEach(id=>{
  const g=$(id),gh=g.querySelector('.gh'),gb=g.querySelector('.gb'),b=gh.querySelector('.ar');
  const set=(cl,inst)=>{slide(gb,!cl,inst);b.textContent=cl?'▸':'▾';b.setAttribute('aria-label',cl?'展開':'收起');FOLD[id]=cl;grpUpd()};
  gh.onclick=()=>{set(!FOLD[id]);try{localStorage.setItem('planner_fold',JSON.stringify(FOLD))}catch(e){}};
  set(!!FOLD[id],true)})}
(function(){const b=document.getElementById('totop');
  const upd=()=>b.classList.toggle('show',(window.scrollY||document.documentElement.scrollTop)>400);
  window.addEventListener('scroll',upd,{passive:true});upd();
  b.onclick=()=>window.scrollTo({top:0,behavior:'smooth'})})();
let TSIG=null,LAST=null,HEADS=[],HEADT=[],FOLD={};try{FOLD=JSON.parse(localStorage.getItem('planner_fold')||'{}')}catch(e){}
function addFold(r,key,list,fn){key='z'+key;
  const h=mk('div',{className:'rh'}),t=mk('div',{className:'rt'}),b=mk('button',{className:'ar'});
  h.append(t,b);r.prepend(h);
  const upd=()=>{const [a,c,dn]=fn();r.classList.toggle('dn',!!dn);t.textContent='';t.append(mk('b',{textContent:a||'（未命名）'}),mk('span',{textContent:c}))};
  const set=cl=>{r.classList.toggle('closed',cl);b.textContent=cl?'▸':'▾';b.setAttribute('aria-label',cl?'展開':'收起');FOLD[key]=cl};
  set(key in FOLD?!!FOLD[key]:true);
  h.onclick=()=>{const nc=!FOLD[key];set(nc);if(!nc){r.classList.add('opening');setTimeout(()=>r.classList.remove('opening'),260)}try{localStorage.setItem('planner_fold',JSON.stringify(FOLD))}catch(e){}};
  list.push(upd);upd();
}
let DOC=null,LOADED=false,svTimer=null;
function persist(){if(!LOADED)return;try{localStorage.setItem('planner_ts',String(Date.now()))}catch(e){}
  if(!DOC)return;clearTimeout(svTimer);svTimer=setTimeout(pushRemote,800)}
function pushRemote(){if(DOC)DOC.set({json:JSON.stringify({S,T}),t:Date.now()}).catch(()=>{})}

function renderPages(L){
  const W=1240,H=1754,M=90,F='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif',pages=[];
  let cv,cx,y;
  const np=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);y=M;pages.push(cv)};
  const wrap=(t,mw)=>{const o=[];let s='';for(const ch of t){if(cx.measureText(s+ch).width>mw){o.push(s);s=ch}else s+=ch}if(s)o.push(s);return o};
  np();
  L.forEach(l=>{
    if(l.k==='g'){y+=26;return}
    if(l.k==='T'){if(y+80>H-M)np();cx.font='bold 54px '+F;cx.fillStyle='#111';cx.textBaseline='alphabetic';cx.fillText(l.t,M,y+54);y+=84;return}
    if(l.k==='h'){if(y+110>H-M)np();y+=10;cx.font='bold 38px '+F;cx.fillStyle='#111';cx.fillText(l.t,M,y+38);y+=52;cx.fillStyle='#bbb';cx.fillRect(M,y,W-2*M,2);y+=18;return}
    if(l.k==='n'){cx.font='28px '+F;const ls=wrap(l.t,W-2*M-20);ls.forEach(s=>{if(y+40>H-M)np();cx.font='28px '+F;cx.fillStyle='#666';cx.fillText(s,M+20,y+28);y+=40});y+=6;return}
    cx.font='32px '+F;const ls=wrap(l.t,(W-2*M)*0.6);
    ls.forEach((s,i)=>{if(y+46>H-M)np();cx.font='32px '+F;cx.fillStyle='#111';cx.textAlign='left';cx.fillText(s,M,y+32);if(i===0){cx.font='bold 32px '+F;cx.textAlign='right';cx.fillText(l.v||'',W-M,y+32);cx.textAlign='left'}y+=46});
  });
  return pages;
}
function buildPdf(pages,dataB64){
  const enc=new TextEncoder(),parts=[],offs=[];let off=0;
  const push=u=>{parts.push(u);off+=u.length},str=s=>push(enc.encode(s));
  const jpgs=pages.map(cv=>{const b=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u});
  const obj=(id,fn)=>{offs[id]=off;str(id+' 0 obj\n');fn();str('\nendobj\n')};
  const n=pages.length;
  str('%PDF-1.4\n');
  obj(1,()=>str('<< /Type /Catalog /Pages 2 0 R /PlannerData '+(3+3*n)+' 0 R >>'));
  obj(2,()=>str('<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  pages.forEach((cv,i)=>{
    const pid=3+3*i,cid=pid+1,iid=pid+2,c='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(pid,()=>str('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>'));
    obj(cid,()=>str('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream'));
    obj(iid,()=>{str('<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpgs[i].length+' >>\nstream\n');push(jpgs[i]);str('\nendstream')});
  });
  const dtxt='PLANNER_DATA_V1\n'+dataB64+'\nPLANNER_DATA_END';
  obj(3+3*n,()=>str('<< /Type /PlannerData /Length '+dtxt.length+' >>\nstream\n'+dtxt+'\nendstream'));
  const total=4+3*n,xr=off;
  str('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let id=1;id<total;id++)str(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  str('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
async function doExport(){
  const btn=$('expb'),old='匯出';btn.disabled=true;btn.textContent='產生中…';

function doImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const buf=new Uint8Array(fr.result);let txt='';
      for(let i=0;i<buf.length;i+=32768)txt+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));
      let json;const m=/PLANNER_DATA_V1\n([A-Za-z0-9+\/=]+)\nPLANNER_DATA_END/.exec(txt);
      if(m){const bin=atob(m[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);json=new TextDecoder().decode(u)}
      else if(txt.trim().startsWith('{'))json=new TextDecoder().decode(buf);
      else throw 0;
      const o=JSON.parse(json);if(!o||!o.S||o.app!=='repay-planner')throw 0;
      askDel('',()=>applyImport(o),{title:'要匯入這份資料嗎？',note:'目前頁面上的所有內容都會被取代。',ok:'匯入'});
    }catch(e){askDel('',()=>{},{single:true,title:'無法匯入',note:'這不是由本頁面匯出的檔案。',ok:'知道了'})}
  };
  fr.readAsArrayBuffer(file);
}
